name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # каждая сборка main сразу выкладывается в Releases: прямая ссылка на .exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Voxa для ПК — тестовая сборка
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Тестовая сборка лаунчера Voxa для Windows.
            Voxa-*-portable.exe запускается без установки, Voxa-*-nsis.exe ставит лаунчер как обычную программу.
            Коммит: ${{ github.sha }}
          files: dist/*.exe
