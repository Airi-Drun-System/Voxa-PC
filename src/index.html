<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.modrinth.com">
<title>Voxa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="side">
  <button class="acc" id="accBtn" title="Сменить ник">
    <span class="face"></span>
    <span><b id="nick">Player</b><small>Офлайн-профиль</small></span>
  </button>
  <nav>
    <button class="game on" data-tab="play">
      <svg viewBox="0 0 108 108"><path d="M54 27.7 77 40.6 54 53.5 31 40.6Z" fill="#B9FFF0"/><path d="M31 40.6 54 53.5v26.7L31 67.3Z" fill="#3FE0BF"/><path d="M77 40.6 54 53.5v26.7l23-12.9Z" fill="#14A88F"/></svg>
      <span><b>Voxa</b><small>Java Edition</small></span>
    </button>
  </nav>
  <span class="grow"></span>
  <button class="sideLink" data-tab="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg>Настройки
  </button>
  <small class="ver">Voxa 0.1</small>
</aside>

<main>
  <header class="top">
    <h1>VOXA</h1>
    <nav class="tabs">
      <button class="on" data-tab="play">Играть</button>
      <button data-tab="installs">Сборки</button>
      <button data-tab="mods">Моды</button>
    </nav>
  </header>

  <!-- Играть: большая картинка и нижняя полоса с кнопкой -->
  <section id="play" class="view on">
    <div class="hero">
      <svg class="art" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b6cb0"/><stop offset=".55" stop-color="#7cc3e8"/><stop offset="1" stop-color="#f6d99a"/></linearGradient>
          <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4e8b8f"/><stop offset="1" stop-color="#2e5e63"/></linearGradient>
        </defs>
        <rect width="1200" height="600" fill="url(#sky)"/>
        <circle cx="930" cy="150" r="46" fill="#fff4c9" opacity=".95"/>
        <g fill="#fff" opacity=".8"><rect x="140" y="90" width="120" height="22"/><rect x="170" y="70" width="60" height="22"/><rect x="620" y="120" width="160" height="22"/><rect x="660" y="100" width="70" height="22"/></g>
        <path d="M0 360h80v-40h80v-30h100v50h120v-60h90v40h110v-30h130v50h100v-40h120v30h90v-50h180v380H0Z" fill="url(#far)"/>
        <path d="M0 430h120v-30h140v40h100v-20h160v30h90v-40h150v30h120v-20h120v20h200v180H0Z" fill="#4f9d45"/>
        <path d="M0 450h120v-30h140v40h100v-20h160v30h90v-40h150v30h120v-20h120v20h200v20H0Z" fill="#3f7f37"/>
        <rect y="470" width="1200" height="130" fill="#7a5233"/>
        <g fill="#6a462b"><rect x="80" y="500" width="40" height="40"/><rect x="300" y="530" width="40" height="40"/><rect x="560" y="505" width="40" height="40"/><rect x="820" y="540" width="40" height="40"/><rect x="1040" y="510" width="40" height="40"/></g>
        <g><rect x="250" y="340" width="20" height="80" fill="#6b4a2b"/><rect x="210" y="280" width="100" height="70" fill="#2f6b30"/><rect x="230" y="250" width="60" height="40" fill="#3b8040"/></g>
        <g><rect x="880" y="350" width="20" height="80" fill="#6b4a2b"/><rect x="845" y="295" width="90" height="65" fill="#2f6b30"/><rect x="865" y="270" width="50" height="35" fill="#3b8040"/></g>
        <g transform="translate(560 380)"><rect width="70" height="70" fill="#9fe7da"/><rect width="70" height="18" fill="#c8fff4"/><rect x="18" y="30" width="10" height="14" fill="#123"/><rect x="42" y="30" width="10" height="14" fill="#123"/></g>
      </svg>
      <div class="heroText"><b>Новая сборка за минуту</b><span>Выбери версию, добавь Fabric — и играй. Java Voxa скачает сама.</span></div>
    </div>

    <footer class="bottom">
      <div class="pickWrap">
        <button class="pick" id="pickBtn" aria-haspopup="listbox">
          <i class="tile" id="pickTile"></i>
          <span><b id="pickName">Нет сборок</b><small id="pickVer">создай первую</small></span>
          <svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5"/></svg>
        </button>
        <div class="pickList" id="pickList" role="listbox" hidden></div>
      </div>
      <button class="play" id="playBtn" disabled><span class="fill" id="playFill"></span><b id="playText">ИГРАТЬ</b><small id="playSub"></small></button>
      <div class="who"><small>Играешь как</small><b id="nick2">Player</b></div>
    </footer>
  </section>

  <!-- Сборки: список как «Установки» -->
  <section id="installs" class="view">
    <div class="listHead">
      <input id="search" placeholder="Поиск сборки" spellcheck="false">
      <button class="primary" id="newBtn">+ Новая сборка</button>
    </div>
    <div class="list" id="list"></div>
  </section>

  <!-- Моды: поиск и установка с Modrinth -->
  <section id="mods" class="view">
    <div class="listHead">
      <div class="seg" role="radiogroup" aria-label="Что искать">
        <label><input type="radio" name="kind" value="mod" checked><span>Моды</span></label>
        <label><input type="radio" name="kind" value="modpack"><span>Сборки</span></label>
        <label><input type="radio" name="kind" value="installed"><span>Установленные</span></label>
      </div>
      <select id="modInst" aria-label="Сборка для модов"></select>
      <input id="modSearch" placeholder="Поиск на Modrinth" spellcheck="false">
    </div>
    <p class="msg modMsg" id="modMsg"></p>
    <div class="list modList" id="modList"></div>
  </section>

  <section id="settings" class="view pad">
    <h2>Настройки</h2>
    <label class="field">Ник в игре
      <input id="setNick" maxlength="16" spellcheck="false" placeholder="Player">
      <small>3–16 символов: латиница, цифры, _</small>
    </label>
    <label class="field">Память для игры: <b id="ramVal">4</b> ГБ
      <input id="setRam" type="range" min="1" max="16" step="1" value="4">
    </label>
    <button class="primary" id="saveSettings">Сохранить</button>
    <p class="msg" id="setMsg"></p>
  </section>
</main>

<dialog id="newDlg">
  <form method="dialog" id="newForm">
    <h2>Новая сборка</h2>
    <label class="field">Название<input id="newName" maxlength="40" placeholder="Выживание" required></label>
    <label class="field">Версия Minecraft<select id="newVer"></select></label>
    <div class="seg" role="radiogroup" aria-label="Загрузчик">
      <label><input type="radio" name="loader" value="vanilla" checked><span>Без модов</span></label>
      <label><input type="radio" name="loader" value="fabric"><span>Fabric</span></label>
    </div>
    <p class="msg" id="newMsg"></p>
    <div class="btns"><button value="cancel" formnovalidate>Отмена</button><button class="primary" id="newOk" value="ok">Создать</button></div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
