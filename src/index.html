<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.modrinth.com">
<title>Voxa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="rail" aria-label="Разделы">
  <svg class="logo" viewBox="0 0 108 108" aria-label="Voxa"><path d="M54 22 82 37.8 54 53.5 26 37.8Z" fill="#B9FFF0"/><path d="M26 37.8 54 53.5v32.5L26 70.3Z" fill="#3FE0BF"/><path d="M82 37.8 54 53.5v32.5l28-15.7Z" fill="#14A88F"/></svg>
  <button class="ic on" data-tab="home" title="Главная"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/></svg></button>
  <button class="ic" data-tab="mods" title="Моды"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg></button>
  <button class="ic" data-tab="settings" title="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg></button>
  <button class="face" id="railFace" title="Скин"><canvas id="faceCv" width="8" height="8"></canvas></button>
</nav>

<!-- Главная: обложка сборки на весь экран -->
<main id="home" class="view on">
  <div class="bg" id="bg"></div><div class="shade"></div>
  <div class="status" id="status" hidden><i id="ring"></i><span id="statusText"></span></div>

  <section class="hero">
    <span class="badge" id="badge"></span>
    <h1 id="title"></h1>
    <p id="sub"></p>
    <div class="acts">
      <button class="glass" id="modsBtn">Моды <em id="modsCount">0</em></button>
      <button class="glass r" id="dirBtn" title="Открыть папку сборки"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg></button>
      <button class="glass r" id="delBtn" title="Удалить сборку"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
    </div>
  </section>

  <section class="strip" aria-label="Сборки">
    <h3>Сборки</h3>
    <div class="cards" id="cards"></div>
  </section>

  <button class="skin" id="skinBtn" title="Сменить скин">
    <canvas id="skinCv" width="16" height="32"></canvas>
    <b id="nick">Player</b><small>Сменить скин</small>
  </button>

  <button class="play" id="playBtn"><span class="fill" id="playFill"></span><b id="playText">Играть</b></button>
</main>

<!-- Моды: поиск и установка с Modrinth -->
<main id="mods" class="view page">
  <h2>Моды</h2>
  <div class="listHead">
    <div class="seg" role="radiogroup" aria-label="Что искать">
      <label><input type="radio" name="kind" value="mod" checked><span>Моды</span></label>
      <label><input type="radio" name="kind" value="modpack"><span>Сборки</span></label>
      <label><input type="radio" name="kind" value="installed"><span>Установленные</span></label>
    </div>
    <select id="modInst" aria-label="Сборка для модов"></select>
    <input id="modSearch" placeholder="Поиск на Modrinth" spellcheck="false">
  </div>
  <p class="msg" id="modMsg"></p>
  <div class="list" id="modList"></div>
</main>

<main id="settings" class="view page">
  <h2>Настройки</h2>
  <label class="field">Ник в игре
    <input id="setNick" maxlength="16" spellcheck="false" placeholder="Player">
    <small>3–16 символов: латиница, цифры, _</small>
  </label>
  <label class="field"><span>Память для игры: <b id="ramVal">4</b> ГБ</span>
    <input id="setRam" type="range" min="1" max="16" step="1" value="4">
  </label>
  <div class="field">Скин
    <span class="skinRow"><button class="ghostBtn" id="skinPick">Выбрать PNG</button><button class="ghostBtn" id="skinReset">Убрать</button></span>
    <small>Файл скина 64×64. В игре он виден с модом CustomSkinLoader: его можно поставить во вкладке «Моды».</small>
  </div>
  <button class="primary" id="saveSettings">Сохранить</button>
  <p class="msg" id="setMsg"></p>
</main>

<dialog id="newDlg">
  <form method="dialog" id="newForm">
    <h2>Новая сборка</h2>
    <label class="field">Название<input id="newName" maxlength="40" placeholder="Выживание" required></label>
    <label class="field">Версия Minecraft<select id="newVer"></select></label>
    <div class="seg" role="radiogroup" aria-label="Загрузчик">
      <label><input type="radio" name="loader" value="vanilla" checked><span>Без модов</span></label>
      <label><input type="radio" name="loader" value="fabric"><span>Fabric</span></label>
    </div>
    <p class="msg" id="newMsg"></p>
    <div class="btns"><button class="ghostBtn" value="cancel" formnovalidate>Отмена</button><button class="primary" id="newOk" value="ok">Создать</button></div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
